name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub occasionally just does not create a run for a push — it happened to
  # two commits here, with Actions enabled, the workflow active and the repo
  # public, so no quota or config to blame. Without a manual trigger the only
  # way to get CI onto that commit is an empty commit, which puts a lie in the
  # history to work around someone else's dropped webhook.
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck
      # Only the files this fork owns. The rest of sdata/lib is inherited from
      # upstream and lints dirty, so including it would make CI red for
      # reasons no change here can fix.
      - name: Lint installer
        run: shellcheck install.sh sdata/lib/tui.sh

  qml-parse:
    name: QML parse gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt declarative tools
        run: sudo apt-get update -q && sudo apt-get install -y qt6-declarative-dev-tools
      - name: Parse-check all shell QML
        # No `set -e`: qmlformat --check returns 1 when a file merely needs
        # reformatting, which is expected and must NOT fail the job. Only a
        # genuine parse error (rc >= 2) counts. `|| rc=$?` keeps the captured
        # exit code from tripping the runner's default errexit.
        run: |
          set +e
          QMLFORMAT="$(command -v qmlformat || echo /usr/lib/qt6/bin/qmlformat)"
          fail=0
          while IFS= read -r -d '' f; do
            rc=0
            "$QMLFORMAT" --check "$f" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then echo "PARSE FAIL: $f"; fail=1; fi
          done < <(find dots/.config/quickshell -name '*.qml' -print0)
          exit "$fail"
